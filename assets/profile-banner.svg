    <text x="920" y="77" font-size="20" font-weight="700" fill="#CBD5E1">API &amp; data</text>
    <text x="920" y="104" font-size="14" fill="#94A3B8">clear contracts, real states</text>
    <rect x="890" y="221" width="255" height="106" rx="12" fill="#162D36" stroke="#5EEAD4" stroke-opacity=".65"/>
    <circle cx="913" cy="248" r="4" fill="#5EEAD4"/>
