<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Kim Youngwoo — Frontend and product builder</title>
  <desc id="desc">A dark blue editorial banner with a connected interface diagram. Build the interface. Connect the product.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#111E35"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#243550" stroke-width="1" opacity=".4"/></pattern>
    <linearGradient id="accent"><stop stop-color="#60A5FA"/><stop offset="1" stop-color="#5EEAD4"/></linearGradient>
  </defs>
  <rect width="1200" height="440" rx="24" fill="url(#bg)"/>
  <rect x="650" width="550" height="440" rx="24" fill="url(#grid)"/>
  <path d="M32 32H1168" stroke="#334155"/>
  <circle cx="56" cy="56" r="4" fill="#5EEAD4"/>
