    <text x="54" y="145" font-size="55" font-weight="700" letter-spacing="-2" fill="#F8FAFC">Kim Youngwoo</text>
    <text x="56" y="189" font-size="21" fill="#93C5FD">FRONTEND DEVELOPER · PRODUCT BUILDER</text>
    <text x="54" y="270" font-size="37" font-weight="700" letter-spacing="-1" fill="#F8FAFC">Build the interface.</text>
    <text x="54" y="315" font-size="37" font-weight="700" letter-spacing="-1" fill="#F8FAFC">Connect the product.</text>
    <text x="56" y="386" font-size="17" fill="#94A3B8">MOBILE-FIRST UX</text>
    <circle cx="229" cy="380" r="2" fill="#5EEAD4"/>
    <text x="247" y="386" font-size="17" fill="#94A3B8">API-FIRST</text>
    <circle cx="347" cy="380" r="2" fill="#5EEAD4"/>
    <text x="365" y="386" font-size="17" fill="#94A3B8">VISUAL QA</text>
    <path d="M772 171H812Q832 171 832 191V248Q832 268 852 268H905" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <path d="M772 171H812Q832 171 832 151V104Q832 84 852 84H915" fill="none" stroke="#3C5478" stroke-width="2"/>
    <rect x="670" y="122" width="150" height="100" rx="12" fill="#17263E" stroke="#47648E"/>
    <rect x="688" y="140" width="44" height="5" rx="2" fill="#60A5FA"/>
    <text x="688" y="176" font-size="22" font-weight="700" fill="#E2E8F0">UI states</text>
